<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Nuri Passkey PRF Recovery</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="panel">
        <div class="heading">
          <p class="eyebrow">Offline recovery</p>
          <h1>Nuri Passkey PRF Recovery</h1>
          <p id="originStatus" class="status neutral">Checking origin...</p>
        </div>

        <div class="singleAction">
          <label>
            <span>Recovery dump, bundle, or server metadata</span>
            <textarea id="recoveryBundle" rows="11" placeholder="Paste Nuri CSV export, Arkade v4 recovery backup plaintext, public envelope, or descriptor JSON"></textarea>
          </label>
          <label>
            <span>Sweep destination Bitcoin address</span>
            <input id="sweepAddress" type="text" autocomplete="off" spellcheck="false" placeholder="bc1...">
          </label>
          <label>
            <span>Fee rate sat/vB</span>
            <input id="feeRate" type="number" min="1" max="1000" step="1" value="5">
          </label>
          <div class="buttonRow">
            <button id="recoverButton" type="button">Recover Keypairs</button>
            <button id="importDumpButton" class="secondary" type="button">Import Dump</button>
          </div>
          <div class="buttonRow">
            <button id="buildSweepButton" type="button">Build Sweep TX</button>
            <button id="broadcastSweepButton" class="secondary" type="button">Broadcast TX</button>
          </div>
          <p id="actionStatus" class="hint">Paste a dump or recover keypairs to start.</p>
        </div>
      </section>

      <section class="panel results">
        <div class="heading compact">
          <p class="eyebrow">Output</p>
          <h2>Recovered keypairs</h2>
        </div>

        <div id="message" class="message neutral">No recovery run yet.</div>
        <p id="metadataStatus" class="status neutral">No server lookup yet.</p>

        <div class="outputGrid">
          <label>
            <span>CSV exit metadata</span>
            <textarea id="recoveryOutput" readonly rows="12"></textarea>
          </label>
          <label>
            <span>UTXOs and wait time</span>
            <textarea id="utxoOutput" readonly rows="12"></textarea>
          </label>
          <label>
            <span>Signed sweep transaction</span>
            <textarea id="sweepOutput" readonly rows="12"></textarea>
          </label>
          <label>
            <span>Bitcoin / CSV address</span>
            <textarea id="bitcoinAddress" readonly rows="2"></textarea>
          </label>
          <label>
            <span>Bitcoin private key</span>
            <textarea id="bitcoinPrivateKey" readonly rows="2"></textarea>
          </label>
          <label>
            <span>Bitcoin public key</span>
            <textarea id="bitcoinPublicKey" readonly rows="2"></textarea>
          </label>
          <label>
            <span>Ethereum address</span>
            <textarea id="ethereumAddress" readonly rows="2"></textarea>
          </label>
          <label>
            <span>Ethereum private key</span>
            <textarea id="ethereumPrivateKey" readonly rows="2"></textarea>
          </label>
          <label>
            <span>Ethereum public key</span>
            <textarea id="ethereumPublicKey" readonly rows="3"></textarea>
          </label>
          <label>
            <span>Export JSON</span>
            <textarea id="exportJson" readonly rows="10"></textarea>
          </label>
        </div>

      </section>
    </main>

    <script src="/app.bundle.js"></script>
  </body>
</html>
